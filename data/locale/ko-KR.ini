SceneAnchor.RestoreConfirm="현재 폴더 배치를 백업 내용으로 교체할까요?\n폴더·순서·색상·별칭·펼침 상태가 복원됩니다. 삭제된 OBS 장면은 복구하지 않으며, 새 장면은 최상위에 표시합니다.\nOBS 원본 장면과 프리뷰·송출 장면은 변경하지 않습니다."
SceneAnchor.BackupChanged="작업 중 장면 모음이나 배치·잠금 상태가 변경되어 복원을 취소했습니다. 다시 시도해 주세요."
SceneAnchor.RemoveFoldersConfirm="선택한 폴더 %1개를 어떻게 삭제할까요?\n폴더만 해제하면 내부 항목과 하위 폴더를 한 단계 밖으로 옮깁니다.\n하위 배치까지 삭제하면 내부 폴더와 장면의 별칭·색상·배치를 지우며, 장면은 최상위에 다시 표시됩니다.\nOBS 원본 장면과 방송 출력은 변경하지 않습니다."
